<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion Coopérative</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.38.4"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:20px}
.container{background:#fff;border-radius:10px;box-shadow:0 10px 40px rgba(0,0,0,.15);width:100%;max-width:420px;padding:36px;margin-top:5vh}
.container.wide{max-width:820px}
.header{text-align:center;margin-bottom:24px}
.logo{font-size:44px;margin-bottom:8px}
h1{color:#333;font-size:24px;margin-bottom:4px}
h2{color:#333;font-size:17px;margin:18px 0 10px}
.subtitle{color:#666;font-size:14px}
.tabs{display:flex;margin-bottom:22px;border-bottom:2px solid #eee}
.tabs button{flex:1;padding:10px;background:none;border:none;font-size:15px;font-weight:600;color:#888;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-2px}
.tabs button.active{color:#667eea;border-bottom-color:#667eea}
.form-group{margin-bottom:16px}
label{display:block;color:#333;font-weight:600;margin-bottom:6px;font-size:14px}
input[type=email],input[type=password],input[type=text]{width:100%;padding:12px;border:2px solid #e0e0e0;border-radius:5px;font-size:14px}
input:focus,select:focus{outline:none;border-color:#667eea}
.btn{width:100%;padding:12px;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);color:#fff;border:none;border-radius:5px;font-size:16px;font-weight:600;cursor:pointer}
.btn:disabled{opacity:.6;cursor:not-allowed}
.btn-small{padding:6px 12px;font-size:13px;width:auto;border-radius:4px}
.btn-logout{width:auto;padding:8px 16px;background:#999;color:#fff;border:none;border-radius:5px;cursor:pointer;font-weight:600}
.btn-logout:hover{background:#666}
.message{margin-top:14px;padding:12px;border-radius:5px;text-align:center;font-size:14px;display:none}
.message.error{background:#fee;color:#c33;border:1px solid #fcc;display:block}
.message.success{background:#efe;color:#2a7a2a;border:1px solid #cfc;display:block}
.message.loading{background:#eef;color:#33c;border:1px solid #ccf;display:block}
.hidden{display:none!important}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.who{font-size:14px;color:#555}
.badge{display:inline-block;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:700;background:#eef;color:#4a4ac8;margin-left:6px}
.badge.en_attente{background:#fff3cd;color:#8a6d00}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:10px}
.card{background:#f5f6ff;border:1px solid #e0e3ff;border-radius:8px;padding:16px}
.card strong{display:block;color:#333;margin-bottom:4px}
.card span{font-size:12px;color:#666}
.notice{background:#fff3cd;color:#6b5400;padding:16px;border-radius:6px;font-size:14px;line-height:1.5}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{text-align:left;padding:10px 8px;border-bottom:1px solid #eee}
th{color:#555;font-size:12px;text-transform:uppercase}
select{padding:7px;border:2px solid #e0e0e0;border-radius:5px;font-size:13px}
.tablewrap{overflow-x:auto}
</style>
</head>
<body>

<!-- ===== CONNEXION / INSCRIPTION ===== -->
<div id="authView" class="container">
  <div class="header">
    <div class="logo">🏢</div>
    <h1>Gestion Coopérative</h1>
    <p class="subtitle">Plateforme de Gestion</p>
  </div>

  <div class="tabs">
    <button type="button" id="tabLogin" class="active">Connexion</button>
    <button type="button" id="tabSignup">Inscription</button>
  </div>

  <form id="loginForm">
    <div class="form-group">
      <label for="loginEmail">Email</label>
      <input type="email" id="loginEmail" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="loginPassword">Mot de passe</label>
      <input type="password" id="loginPassword" required autocomplete="current-password">
    </div>
    <button type="submit" class="btn" id="loginBtn">Se connecter</button>
  </form>

  <form id="signupForm" class="hidden">
    <div class="form-group">
      <label for="signupNom">Nom complet</label>
      <input type="text" id="signupNom" required autocomplete="name">
    </div>
    <div class="form-group">
      <label for="signupEmail">Email</label>
      <input type="email" id="signupEmail" required autocomplete="email">
    </div>
    <div class="form-group">
      <label for="signupPassword">Mot de passe (6 caractères minimum)</label>
      <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password">
    </div>
    <div class="form-group">
      <label for="signupPassword2">Confirmer le mot de passe</label>
      <input type="password" id="signupPassword2" required minlength="6" autocomplete="new-password">
    </div>
    <button type="submit" class="btn" id="signupBtn">Créer mon compte</button>
  </form>

  <div id="message" class="message"></div>
</div>

<!-- ===== APPLICATION (après connexion) ===== -->
<div id="appView" class="container wide hidden">
  <div class="topbar">
    <div class="who"><span id="userEmail"></span><span id="roleBadge" class="badge"></span></div>
    <button class="btn-logout" id="logoutBtn" type="button">Se déconnecter</button>
  </div>

  <!-- En attente d'un rôle -->
  <div id="pendingView" class="hidden">
    <div class="notice">
      ⏳ Votre compte est créé, mais l'administrateur ne vous a pas encore attribué de rôle.
      Revenez après validation.
    </div>
  </div>

  <!-- Sections selon le rôle -->
  <div id="sectionsView" class="hidden">
    <h2>Vos accès</h2>
    <div class="cards" id="cards"></div>
  </div>

  <!-- Administration (admin uniquement) -->
  <div id="adminView" class="hidden">
    <h2>Gestion des utilisateurs</h2>
    <div class="tablewrap">
      <table>
        <thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th></th></tr></thead>
        <tbody id="usersBody"></tbody>
      </table>
    </div>
    <div id="adminMessage" class="message"></div>
  </div>
</div>

<script>
// ===== CONFIGURATION SUPABASE =====
const SUPABASE_URL = 'https://xeerwmpowlcwdfhhbwez.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InhlZXJ3bXBvd2xjd2RmaGhid2V6Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODIyMjkzNzUsImV4cCI6MjA5NzgwNTM3NX0.mJe6w6XY5NSacutxnLHtz3rQrbEFWORRe-45Nl2S92o';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// ===== RÔLES =====
const ROLES = {
  admin:      'Administrateur',
  dg:         'Directeur Général',
  comptable:  'Comptable',
  tresorier:  'Trésorier',
  membre:     'Membre simple',
  en_attente: 'En attente'
};

// Sections visibles par rôle
const SECTIONS = {
  membres:    { titre: '👥 Gestion des membres',      desc: 'Liste et fiches des membres',   roles: ['admin','dg'] },
  compta:     { titre: '📊 Comptabilité / Finances',  desc: 'Écritures et bilans',           roles: ['admin','dg','comptable'] },
  cotisations:{ titre: '💰 Cotisations / Paiements',  desc: 'Encaissements et suivi',        roles: ['admin','dg','comptable','tresorier'] },
  rapports:   { titre: '📈 Rapports / Statistiques',  desc: 'Tableaux de bord',              roles: ['admin','dg','comptable','tresorier'] },
  moncompte:  { titre: '🙋 Mon espace',               desc: 'Mes cotisations et informations', roles: ['admin','dg','comptable','tresorier','membre'] }
};

// ===== ÉLÉMENTS =====
const $ = (id) => document.getElementById(id);
const authView = $('authView'), appView = $('appView');
const messageDiv = $('message');

function showMessage(text, type) {
  messageDiv.textContent = text;
  messageDiv.className = 'message ' + type;
}
function clearMessage() { messageDiv.className = 'message'; messageDiv.textContent = ''; }

// ===== ONGLETS =====
function switchTab(tab) {
  const login = tab === 'login';
  $('loginForm').classList.toggle('hidden', !login);
  $('signupForm').classList.toggle('hidden', login);
  $('tabLogin').classList.toggle('active', login);
  $('tabSignup').classList.toggle('active', !login);
  clearMessage();
}
$('tabLogin').addEventListener('click', () => switchTab('login'));
$('tabSignup').addEventListener('click', () => switchTab('signup'));

// ===== CONNEXION =====
$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = $('loginBtn');
  btn.disabled = true;
  showMessage('⏳ Connexion en cours...', 'loading');
  const { error } = await sb.auth.signInWithPassword({
    email: $('loginEmail').value.trim(),
    password: $('loginPassword').value
  });
  btn.disabled = false;
  if (error) {
    if (error.message.includes('Invalid login credentials')) showMessage('❌ Email ou mot de passe incorrect', 'error');
    else if (error.message.includes('Email not confirmed')) showMessage('❌ Confirmez votre email avant de vous connecter', 'error');
    else showMessage('❌ ' + error.message, 'error');
    return;
  }
  clearMessage();
  // la suite est gérée par onAuthStateChange
});

// ===== INSCRIPTION LIBRE =====
$('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const nom = $('signupNom').value.trim();
  const email = $('signupEmail').value.trim();
  const pw = $('signupPassword').value;
  if (pw !== $('signupPassword2').value) { showMessage('❌ Les mots de passe ne correspondent pas', 'error'); return; }
  if (pw.length < 6) { showMessage('❌ Mot de passe : 6 caractères minimum', 'error'); return; }

  const btn = $('signupBtn');
  btn.disabled = true;
  showMessage('⏳ Création du compte...', 'loading');
  const { data, error } = await sb.auth.signUp({
    email, password: pw,
    options: { data: { nom } }
  });
  btn.disabled = false;
  if (error) { showMessage('❌ ' + error.message, 'error'); return; }

  if (data.session) {
    clearMessage(); // connecté directement (confirmation email désactivée)
  } else {
    $('signupForm').reset();
    showMessage('✅ Compte créé. Vérifiez votre email pour confirmer, puis connectez-vous. L\'administrateur vous attribuera ensuite un rôle.', 'success');
  }
});

// ===== PROFIL =====
async function loadProfile(user) {
  const { data, error } = await sb.from('coop_profiles')
    .select('id,email,nom,role').eq('id', user.id).maybeSingle();
  if (error) { console.error(error.message); return null; }
  return data;
}

async function showApp(user) {
  const profile = await loadProfile(user);
  const role = profile ? profile.role : 'en_attente';

  $('userEmail').textContent = (profile && profile.nom ? profile.nom + ' — ' : '') + user.email;
  const badge = $('roleBadge');
  badge.textContent = ROLES[role] || role;
  badge.className = 'badge ' + role;

  $('pendingView').classList.toggle('hidden', role !== 'en_attente');
  $('sectionsView').classList.toggle('hidden', role === 'en_attente');
  $('adminView').classList.toggle('hidden', role !== 'admin');

  // Cartes selon le rôle
  const cards = $('cards');
  cards.textContent = '';
  Object.values(SECTIONS).filter(s => s.roles.includes(role)).forEach(s => {
    const c = document.createElement('div'); c.className = 'card';
    const t = document.createElement('strong'); t.textContent = s.titre;
    const d = document.createElement('span'); d.textContent = s.desc;
    c.append(t, d); cards.appendChild(c);
  });

  authView.classList.add('hidden');
  appView.classList.remove('hidden');

  if (role === 'admin') loadUsers(user.id);
}

// ===== ADMIN : liste des utilisateurs et attribution des rôles =====
async function loadUsers(myId) {
  const body = $('usersBody');
  const { data, error } = await sb.from('coop_profiles')
    .select('id,email,nom,role').order('created_at', { ascending: false });
  body.textContent = '';
  if (error) { showAdminMessage('❌ ' + error.message, 'error'); return; }

  data.forEach(u => {
    const tr = document.createElement('tr');
    const tdNom = document.createElement('td'); tdNom.textContent = u.nom || '—';
    const tdMail = document.createElement('td'); tdMail.textContent = u.email;
    const tdRole = document.createElement('td');
    const sel = document.createElement('select');
    Object.entries(ROLES).forEach(([val, label]) => {
      const o = document.createElement('option');
      o.value = val; o.textContent = label;
      if (val === u.role) o.selected = true;
      sel.appendChild(o);
    });
    if (u.id === myId) sel.disabled = true; // l'admin ne modifie pas son propre rôle
    tdRole.appendChild(sel);
    const tdBtn = document.createElement('td');
    if (u.id !== myId) {
      const b = document.createElement('button');
      b.className = 'btn btn-small'; b.textContent = 'Enregistrer';
      b.addEventListener('click', async () => {
        b.disabled = true;
        const { error: err } = await sb.from('coop_profiles').update({ role: sel.value }).eq('id', u.id);
        b.disabled = false;
        if (err) showAdminMessage('❌ ' + err.message, 'error');
        else showAdminMessage('✅ Rôle mis à jour : ' + (u.nom || u.email) + ' → ' + ROLES[sel.value], 'success');
      });
      tdBtn.appendChild(b);
    }
    tr.append(tdNom, tdMail, tdRole, tdBtn);
    body.appendChild(tr);
  });
}
function showAdminMessage(text, type) {
  const m = $('adminMessage'); m.textContent = text; m.className = 'message ' + type;
}

// ===== DÉCONNEXION =====
$('logoutBtn').addEventListener('click', async () => { await sb.auth.signOut(); });

// ===== SESSION =====
sb.auth.onAuthStateChange((event, session) => {
  if (session && session.user) {
    // setTimeout évite un blocage de supabase-js quand on appelle l'API dans ce callback
    setTimeout(() => showApp(session.user), 0);
  } else {
    appView.classList.add('hidden');
    authView.classList.remove('hidden');
    $('loginForm').reset();
    switchTab('login');
  }
});
</script>
</body>
</html>
